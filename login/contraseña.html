<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arichoc - Recuperar y Cambiar Contraseña</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#d4a574',
                        'primary-dark': '#c49564',
                        dark: '#333333',
                        'dark-alt': '#2c2c2a',
                        muted: '#666666',
                        'border-custom': '#777777',
                        'light-gray': '#eeeeee',
                        error: '#dc3545',
                        success: '#28a745'
                    },
                    fontFamily: {
                        sans: ['Segoe UI', 'Tahoma', 'Geneva', 'Verdana', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer components {
            .input-campo {
                @apply w-full h-[42px] px-3.5 py-2.5 mb-2 border-2 border-border-custom rounded-[10px] text-sm text-dark bg-white transition duration-200 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 invalid:[&:not(:placeholder-shown)]:border-error valid:[&:not(:placeholder-shown)]:border-success;
            }
            .boton-accion {
                @apply w-full h-[45px] bg-dark hover:bg-primary text-white font-semibold text-sm rounded-[10px] cursor-pointer mt-3 transition-all duration-200 flex items-center justify-center focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 disabled:opacity-60 disabled:cursor-not-allowed;
            }
            .contenedor-password {
                @apply relative mb-2 w-full;
            }
            .contenedor-password input {
                @apply mb-0 pr-11;
            }
            .alternar-password {
                @apply absolute right-3 top-1/2 -translate-y-1/2 bg-transparent border-0 cursor-pointer p-1 text-[#777] hover:text-dark flex items-center justify-center rounded focus-visible:outline-2 focus-visible:outline-primary;
            }
            .etiqueta-formulario {
                @apply block text-left font-semibold text-sm text-dark mb-1;
            }
            .error {
                @apply block text-error text-xs text-left mb-2 min-h-[16px] font-medium;
            }
            .barra-fortaleza {
                @apply h-1 bg-[#eee] rounded-sm overflow-hidden mb-1 mt-1;
            }
            .relleno-fortaleza {
                @apply h-full transition-all duration-300 ease-in-out;
            }
        }
    </style>
</head>

<body class="bg-[#f9f9f9] text-dark font-sans min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Notificación Toast sin uso de alert() -->
    <div id="toastNotificacion"
        class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-dark text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none"
        role="alert" aria-live="assertive">
        <span id="toastIcono" class="text-primary text-lg">✓</span>
        <span id="toastMensaje" class="text-sm font-medium">Operación realizada</span>
    </div>

    <!-- Contenedor Principal -->
    <div
        class="w-full max-w-[380px] bg-white rounded-2xl p-6 sm:p-8 shadow-[0_4px_20px_rgba(0,0,0,0.06)] border border-gray-100 transition-all duration-300">

        <!-- Logo -->
        <div class="flex justify-center mb-4">
            <img src="img/logo.png" onerror="this.onerror=null; this.src='../img/logo.png';"
                class="w-28 h-28 object-contain" alt="Logo Arichoc">
        </div>

        <!-- FORMULARIO 1: RECUPERAR CONTRASEÑA -->
        <form id="recuperarPassword" novalidate class="block">
            <h1 class="text-2xl font-bold text-dark text-center mb-1">Recuperar contraseña</h1>

            <!-- Paso 1: Verificar correo registrado -->
            <div id="pasoEmail" class="block">
                <p class="text-xs text-muted text-center mb-5">Ingresa tu correo para verificar tu cuenta</p>

                <label for="recEmail" class="etiqueta-formulario">Correo electrónico</label>
                <input class="input-campo" type="email" id="recEmail" placeholder="tu@correo.com" autocomplete="email"
                    aria-describedby="recEmailError" required>
                <span class="error" id="recEmailError" aria-live="polite"></span>

                <button id="btnVerificarEmail" type="button" class="boton-accion">Verificar cuenta</button>
                <span class="error text-center mt-2" id="recuperarError" aria-live="assertive"></span>
            </div>

            <!-- Paso 2: Crear nueva contraseña tras verificación -->
            <div id="pasoNuevaPassword" style="display: none;">
                <p class="text-xs text-success text-center font-medium mb-4">✓ Cuenta verificada. Ingresa tu nueva
                    contraseña</p>

                <label for="recNuevaPassword" class="etiqueta-formulario">Nueva contraseña</label>
                <div class="contenedor-password">
                    <input class="input-campo" type="password" id="recNuevaPassword" placeholder="Mínimo 8 caracteres"
                        autocomplete="new-password" aria-describedby="recNuevaPasswordError" required>
                    <button type="button" class="alternar-password" id="toggleRecNuevaPassword"
                        aria-label="Mostrar contraseña">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <div class="fortaleza-password mb-2" id="passwordStrengthRecuperar" aria-live="polite"></div>
                <span class="error" id="recNuevaPasswordError" aria-live="polite"></span>

                <label for="recConfirmarPassword" class="etiqueta-formulario">Confirmar nueva contraseña</label>
                <div class="contenedor-password">
                    <input class="input-campo" type="password" id="recConfirmarPassword"
                        placeholder="Confirma tu contraseña" autocomplete="new-password"
                        aria-describedby="recConfirmarPasswordError" required>
                    <button type="button" class="alternar-password" id="toggleRecConfirmarPassword"
                        aria-label="Mostrar contraseña">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                    </button>
                </div>
                <span class="error" id="recConfirmarPasswordError" aria-live="polite"></span>

                <button id="btnActualizarPassword" type="button" class="boton-accion">Actualizar contraseña</button>
                <span class="error text-center mt-2" id="actualizarPasswordError" aria-live="assertive"></span>
            </div>

            <p class="text-center text-sm text-muted mt-5">
                <a href="login.html" class="text-primary font-bold hover:underline">Volver al inicio de sesión</a>
            </p>
        </form>

        <!-- FORMULARIO 2: CAMBIAR CONTRASEÑA (SESIÓN ACTIVA O MODO MANUAL) -->
        <form id="cambiarPassword" novalidate style="display: none;">
            <h1 class="text-2xl font-bold text-dark text-center mb-1">Cambiar contraseña</h1>
            <p class="text-xs text-muted text-center mb-5">Ingresa tu contraseña actual y define una nueva</p>

            <label for="pwdActual" class="etiqueta-formulario">Contraseña actual</label>
            <div class="contenedor-password">
                <input class="input-campo" type="password" id="pwdActual" placeholder="Contraseña actual"
                    autocomplete="current-password" aria-describedby="pwdActualError" required>
                <button type="button" class="alternar-password" id="togglePwdActual" aria-label="Mostrar contraseña">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <span class="error" id="pwdActualError" aria-live="polite"></span>

            <label for="pwdNueva" class="etiqueta-formulario">Nueva contraseña</label>
            <div class="contenedor-password">
                <input class="input-campo" type="password" id="pwdNueva" placeholder="Mínimo 8 caracteres"
                    autocomplete="new-password" aria-describedby="pwdNuevaError" required>
                <button type="button" class="alternar-password" id="togglePwdNueva" aria-label="Mostrar contraseña">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <div class="fortaleza-password mb-2" id="passwordStrengthCambio" aria-live="polite"></div>
            <span class="error" id="pwdNuevaError" aria-live="polite"></span>

            <label for="pwdConfirmar" class="etiqueta-formulario">Confirmar nueva contraseña</label>
            <div class="contenedor-password">
                <input class="input-campo" type="password" id="pwdConfirmar" placeholder="Confirma tu contraseña"
                    autocomplete="new-password" aria-describedby="pwdConfirmarError" required>
                <button type="button" class="alternar-password" id="togglePwdConfirmar" aria-label="Mostrar contraseña">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <span class="error" id="pwdConfirmarError" aria-live="polite"></span>

            <button id="btnCambiarPassword" type="submit" class="boton-accion">Actualizar contraseña</button>
            <span class="error text-center mt-2" id="cambiarPasswordError" aria-live="assertive"></span>

            <p class="text-center text-sm text-muted mt-5">
                <a href="login.html" class="text-primary font-bold hover:underline">Volver al inicio de sesión</a>
            </p>
        </form>

    </div>
    <script src="script2.js"></script>
</body>

</html>
