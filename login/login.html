<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arichoc - Iniciar Sesión y Registro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#d4a574',
                        'primary-dark': '#c49564',
                        dark: '#333333',
                        'dark-alt': '#2c2c2a',
                        muted: '#666666',
                        'border-custom': '#777777',
                        'light-gray': '#eeeeee',
                        error: '#dc3545',
                        success: '#28a745'
                    },
                    fontFamily: {
                        sans: ['Segoe UI', 'Tahoma', 'Geneva', 'Verdana', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer components {
            .input-campo {
                @apply w-full h-[42px] px-3.5 py-2.5 mb-2 border-2 border-border-custom rounded-[10px] text-sm text-dark bg-white transition duration-200 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 invalid:[&:not(:placeholder-shown)]:border-error valid:[&:not(:placeholder-shown)]:border-success;
            }
            .boton-accion {
                @apply w-full h-[45px] bg-dark hover:bg-primary text-white font-semibold text-sm rounded-[10px] cursor-pointer mt-3 transition-all duration-200 flex items-center justify-center focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 disabled:opacity-60 disabled:cursor-not-allowed;
            }
            .contenedor-password {
                @apply relative mb-2 w-full;
            }
            .contenedor-password input {
                @apply mb-0 pr-11;
            }
            .alternar-password {
                @apply absolute right-3 top-1/2 -translate-y-1/2 bg-transparent border-0 cursor-pointer p-1 text-[#777] hover:text-dark flex items-center justify-center rounded focus-visible:outline-2 focus-visible:outline-primary;
            }
            .etiqueta-formulario {
                @apply block text-left font-semibold text-sm text-dark mb-1;
            }
            .error {
                @apply block text-error text-xs text-left mb-2 min-h-[16px] font-medium;
            }
            .barra-fortaleza {
                @apply h-1 bg-[#eee] rounded-sm overflow-hidden mb-1 mt-1;
            }
            .relleno-fortaleza {
                @apply h-full transition-all duration-300 ease-in-out;
            }
        }
    </style>
</head>

<body class="bg-[#f9f9f9] text-dark font-sans min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Notificación Toast sin uso de alert() -->
    <div id="toastNotificacion"
        class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-dark text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none"
        role="alert" aria-live="assertive">
        <span id="toastIcono" class="text-primary text-lg">✓</span>
        <span id="toastMensaje" class="text-sm font-medium">Operación realizada</span>
    </div>

    <!-- Contenedor de Autenticación -->
    <div
        class="w-full max-w-[380px] bg-white rounded-2xl p-6 sm:p-8 shadow-[0_4px_20px_rgba(0,0,0,0.06)] border border-gray-100 transition-all duration-3">

        <!-- Logo -->
        <div class="flex justify-center mb-4">
            <img src="img/logo.png" onerror="this.onerror=null; this.src='../img/logo.png';"
                class="w-28 h-28 object-contain" alt="Logo Arichoc">
        </div>

        <!-- FORMULARIO: INICIAR SESIÓN -->
        <form id="login" novalidate class="block">
            <h1 class="text-2xl font-bold text-dark text-center mb-5">Iniciar sesión</h1>

            <label for="email" class="etiqueta-formulario">Correo electrónico</label>
            <input class="input-campo" type="email" id="email" placeholder="tu@correo.com" autocomplete="email"
                aria-describedby="emailError" required>
            <span class="error" id="emailError" aria-live="polite"></span>

            <label for="password" class="etiqueta-formulario">Contraseña</label>
            <div class="contenedor-password">
                <input class="input-campo" type="password" id="password" placeholder="••••••••"
                    autocomplete="current-password" aria-describedby="passwordError" required>
                <button type="button" class="alternar-password" id="togglePassword"
                    aria-label="Mostrar u ocultar contraseña">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <span class="error" id="passwordError" aria-live="polite"></span>

            <!-- Opciones adicionales -->
            <div class="flex items-center justify-between my-2 text-xs sm:text-sm">
                <label class="flex items-center gap-2 cursor-pointer text-muted select-none">
                    <input type="checkbox" id="rememberMe"
                        class="w-4 h-4 rounded text-primary accent-primary cursor-pointer">
                    <span>Recordarme</span>
                </label>
                <a href="contraseña.html"
                    class="text-muted font-semibold hover:text-primary transition-colors duration-200">¿Olvidaste tu
                    contraseña?</a>
            </div>

            <span class="error text-center" id="loginError" aria-live="assertive"></span>

            <button id="btnLogin" type="submit" class="boton-accion">Iniciar sesión</button>

            <p class="text-center text-sm text-muted mt-5">
                ¿No tienes una cuenta?
                <a href="#crear-cuenta" class="text-primary font-bold hover:underline"
                    onclick="mostrarCrearCuenta(); return false;">Créala aquí</a>
            </p>
        </form>

        <!-- FORMULARIO: CREAR CUENTA -->
        <form id="crearCuenta" novalidate style="display: none;">
            <h1 class="text-2xl font-bold text-dark text-center mb-5">Crear cuenta</h1>

            <label for="regNombre" class="etiqueta-formulario">Nombre</label>
            <input class="input-campo" type="text" id="regNombre" placeholder="Tu nombre" autocomplete="given-name"
                aria-describedby="regNombreError" required>
            <span class="error" id="regNombreError" aria-live="polite"></span>

            <label for="regApellido" class="etiqueta-formulario">Apellido</label>
            <input class="input-campo" type="text" id="regApellido" placeholder="Tu apellido" autocomplete="family-name"
                aria-describedby="regApellidoError" required>
            <span class="error" id="regApellidoError" aria-live="polite"></span>

            <label for="regEmail" class="etiqueta-formulario">Correo electrónico</label>
            <input class="input-campo" type="email" id="regEmail" placeholder="nombre@ejemplo.com" autocomplete="email"
                aria-describedby="regEmailError" required>
            <span class="error" id="regEmailError" aria-live="polite"></span>

            <label for="regPassword" class="etiqueta-formulario">Contraseña</label>
            <div class="contenedor-password">
                <input class="input-campo" type="password" id="regPassword" placeholder="Mínimo 8 caracteres"
                    autocomplete="new-password" aria-describedby="regPasswordError" required>
                <button type="button" class="alternar-password" id="toggleRegPassword" aria-label="Mostrar contraseña">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <div class="fortaleza-password mb-2" id="passwordStrength" aria-live="polite"></div>
            <span class="error" id="regPasswordError" aria-live="polite"></span>

            <label for="regConfirmPassword" class="etiqueta-formulario">Confirmar contraseña</label>
            <div class="contenedor-password">
                <input class="input-campo" type="password" id="regConfirmPassword" placeholder="Repite tu contraseña"
                    autocomplete="new-password" aria-describedby="regConfirmError" required>
                <button type="button" class="alternar-password" id="toggleConfirmPassword"
                    aria-label="Mostrar contraseña">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <span class="error" id="regConfirmError" aria-live="polite"></span>

            <button id="btnRegistrar" type="submit" class="boton-accion">Registrarse</button>
            <span class="error text-center mt-2" id="registerError" aria-live="assertive"></span>

            <p class="text-center text-sm text-muted mt-5">
                ¿Ya tienes una cuenta?
                <a href="#login" class="text-primary font-bold hover:underline"
                    onclick="mostrarLogin(); return false;">Inicia sesión</a>
            </p>
        </form>

    </div>
    <script src="script.js"></script>
</body>

</html>
